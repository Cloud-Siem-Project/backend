name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "master.py"
      - "worker.py"
  workflow_dispatch:

env:
  AWS_REGION: eu-central-1

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload master.py + worker.py to S3
        run: |
          aws s3 cp master.py "s3://${{ vars.S3_CODE_BUCKET }}/master.py"
          aws s3 cp worker.py "s3://${{ vars.S3_CODE_BUCKET }}/worker.py"

      - name: Restart service via SSM
        run: |
          # Resolve the master instance by tag so a Terraform replace (new
          # instance id) doesn't break the deploy. Falls back to the EC2_INSTANCE_ID
          # var if the lookup finds nothing.
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=cloudguard-dns-staging-backend-instance" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -z "$INSTANCE_ID" ]; then INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"; fi
          echo "Target master instance: $INSTANCE_ID"
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["aws s3 cp s3://'"${{ vars.S3_CODE_BUCKET }}"'/master.py /opt/cloudsiem/master.py","aws s3 cp s3://'"${{ vars.S3_CODE_BUCKET }}"'/worker.py /opt/cloudsiem/worker.py","systemctl restart cloudsiem-master"]' \
            --comment "CI/CD deploy ${{ github.sha }}" \
            --output text \
            --query "Command.CommandId"
